server {
    listen 80;

    # API requests go to backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Homepage
    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Everything else = short code → send to backend
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}